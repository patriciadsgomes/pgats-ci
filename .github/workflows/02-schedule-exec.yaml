# CI de Nivel 02 - Execucao agendada

# nome da pipeline
name: "Execucao Agendada"

# gatilhos / triggers - regras de disparo
# gatilho agendado = schedule

on:
    schedule:
        # Executa aos sabados as 00:03 UTC.
        # Campos: minuto, hora, dia do mes, mes, dia da semana.
        - cron: "3 0 * * 6"

# tarefas dentro da pipeline = jobs

jobs:
    # nome do job
    e2e-tests:
        # maquina onde o job vai rodar
        runs-on: self-hosted
        defaults:
            run:
                working-directory: pgats-ci

        # passos do job
        steps:
            # clone do projeto
            - uses: actions/checkout@v4

            # instalacao do node
            - uses: actions/setup-node@v4
              with:
                  node-version: 24.x

            # instalacao do Yarn
            - name: Instalando Yarn
              run: npm install -g yarn

            # instalacao das dependencias
            - name: Instalando dependencias
              run: yarn

            # instalacao dos Browsers do Playwright
            - name: Instalando Browsers do Playwright
              run: yarn playwright install

            # executar os testes e2e
            - name: Executando testes e2e
              run: yarn run e2e

            # upload do relatorio HTML gerado pelo Playwright
            - name: Upload do relatorio Playwright
              uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: playwright-report
                  path: pgats-ci/playwright-report/
